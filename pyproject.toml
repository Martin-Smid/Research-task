[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "uldm-simulation"
version = "0.1.0"
description = "Spectral Schroedinger-Poisson solver for ultralight (fuzzy) dark matter with baryons, gas and sinks (CuPy)"
requires-python = ">=3.11"
dependencies = [
    "numpy",
    "scipy",
    "matplotlib",
    "pandas",
    "astropy",
    "tqdm",
]

[project.optional-dependencies]
# CuPy depends on the CUDA version: pick one (or install cupy yourself).
# Tested: Python 3.11.4 + numpy 2.2.2 + CuPy 13.3.0 (Windows), Python 3.12.3 + numpy 1.x + CuPy 13.3.0 (Koios, CUDA 12 wheels).
cuda12 = ["cupy-cuda12x"]
cuda11 = ["cupy-cuda11x"]
docs = ["sphinx", "furo", "myst-parser"]

[tool.setuptools.packages.find]
include = ["resources*"]
namespaces = true
